<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Alex Waldrop mark</title>
  <desc id="desc">Simple compass arrow mark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so it reads clearly at 16px -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Bold, simple arrow pointing north -->
  <path
    d="M20 44 L32 18 L44 44 Z"
    fill="#e5f0ff"
  />
</svg>
